<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Duino-JS</title>
    </head>
    <body>
        <h1>I am mining Duino-Coin on your pc now.</h1>

        <!-- 1. 로그 표시 구역과 지우기 버튼 -->
        <div style="margin-bottom: 10px;">
            <button onclick="clearLogs()" style="cursor: pointer; padding: 5px 10px;">로그 지우기</button>
        </div>
        <div id="log-container" style="background: #222; color: #0f0; padding: 15px; height: 300px; overflow-y: scroll; font-family: monospace; border-radius: 5px; font-size: 13px; line-height: 1.5;">
            <div>채굴 로그 대기 중...</div>
        </div>

        <!-- 2. 메인 스크립트 로드 -->
        <script src="duino-js.js"></script>

        <script>
            // 3. 로그 화면 출력 기능
            const logContainer = document.getElementById('log-container');
            function clearLogs() { logContainer.innerHTML = ''; }

            (function() {
                const oldLog = console.log;
                console.log = function(message) {
                    oldLog.apply(console, arguments);
                    const logEntry = document.createElement('div');
                    logEntry.textContent = `> ${message}`;
                    logContainer.appendChild(logEntry);
                    logContainer.scrollTop = logContainer.scrollHeight;
                };
            })();

            // 4. 마이너 설정 (경험하신 대로 따옴표 유지)
            const username = `jiwonkim_korea_2014`; 
            const rigid = `Duino-JS`; 
            const threads = 1; 
            const miningkey = "null"; // 따옴표 유지

            // 실행
            if (typeof startMiner === 'function') {
                startMiner(username, rigid, threads, miningkey);
            }
        </script>
    </body>
</html>
