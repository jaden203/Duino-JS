<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUCO 실시간 대시보드</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card { background: #fff8e1; border-left: 5px solid #ffc107; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; color: white; transition: 0.3s; }
        .btn-start { background: #28a745; }
        .btn-stop { background: #dc3545; }
        .balance { font-size: 2em; color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⛏️ DUCO Web Miner</h1>

    <!-- 1. 지갑 정보 카드 -->
    <div class="card">
        <h3 style="margin-top:0">💰 실시간 지갑 잔액</h3>
        <div class="balance" id="duco-balance">0.0000</div>
        <p>DUCO (지갑 잔고)</p>
        <p>연결된 채굴기: <span id="miner-count" style="font-weight:bold">0</span>개</p>
        <small>마지막 업데이트: <span id="last-update">-</span></small>
    </div>

    <!-- 2. 제어 버튼 -->
    <div style="text-align: center; margin-bottom: 20px;">
        <div id="status-text" style="margin-bottom:10px; color: #666;">상태: 정지됨 (준비 완료)</div>
        <button id="start-btn" class="btn btn-start" onclick="runMiner()">채굴 시작하기</button>
        <button id="stop-btn" class="btn btn-stop" onclick="stopMiner()" style="display:none">채굴 중지하기</button>
    </div>
</div>

<script src="duino-js.js"></script>

<script>
    const username = "jiwonkim_korea_2014";
    const rigid = "Duino-JS";
    const threads = 1;
    const miningkey = "null";
    let isMining = false;

    // --- 지갑 정보 가져오기 (API 주소 수정됨) ---
    async function updateWalletInfo() {
        try {
            // 올바른 API 주소: ://duinocoin.com
            const response = await fetch(`https://duinocoin.com{username}`);
            const data = await response.json();
            
            if (data.success) {
                const user = data.result;
                document.getElementById('duco-balance').innerText = parseFloat(user.balance).toFixed(4);
                document.getElementById('miner-count').innerText = user.miners ? user.miners.length : 0;
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            }
        } catch (e) {
            console.log("지갑 정보를 불러올 수 없습니다 (네트워크 확인).");
        }
    }

    // --- 채굴 시작 ---
    function runMiner() {
        if (!isMining) {
            if (typeof startMiner === 'function') {
                startMiner(username, rigid, threads, miningkey);
                isMining = true;
                document.getElementById('status-text').innerText = "상태: 채굴 진행 중...";
                document.getElementById('status-text').style.color = "green";
                document.getElementById('start-btn').style.display = "none";
                document.getElementById('stop-btn').style.display = "inline-block";
                updateWalletInfo();
            } else {
                alert("duino-js.js 파일을 찾을 수 없습니다.");
            }
        }
    }

    // --- 채굴 중지 ---
    function stopMiner() {
        if (confirm("채굴을 중지하고 페이지를 새로고침하시겠습니까?")) {
            location.reload();
        }
    }

    // 초기 실행 및 1분마다 자동 갱신
    updateWalletInfo();
    setInterval(updateWalletInfo, 60000);
</script>

</body>
</html>
